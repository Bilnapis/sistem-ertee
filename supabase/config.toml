project_id = "sistem-ertee"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://127.0.0.1:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[functions.create-resident]
# Publishable keys are not JWTs; the handler validates the user's bearer token,
# and the database rechecks the live session and role when creating the profile.
verify_jwt = false

[functions.update-resident-password]
# The handler verifies the bearer token and live manager session/role itself.
verify_jwt = false
